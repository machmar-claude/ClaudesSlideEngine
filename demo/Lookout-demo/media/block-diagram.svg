<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <!-- Lookout electronics block diagram. Values from hardware/scripts/design.py and the design spec (2026-11-17). -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <style>
      .b{fill:#fff;stroke:#333;stroke-width:1.4}
      .p{fill:#fdecea;stroke:#b3261e;stroke-width:1.4}
      .m{fill:#e8f0fe;stroke:#1a56c4;stroke-width:1.8}
      .o{fill:#f3f3f3;stroke:#666;stroke-width:1.2}
      .t{font-weight:bold}
      .s{font-size:11px;fill:#555}
      .w{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .pw{stroke:#b3261e;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .l{font-size:11px;fill:#333}
      .lp{font-size:11px;fill:#b3261e}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="20" y="28" font-size="18" class="t">Lookout: electronics block diagram</text>
  <text x="20" y="46" class="s">KTE Project 4 · 2026-11-18 · parts in docs/bom.md · red = power, black = signals · no radio in our product, the phone does Wi-Fi</text>

  <!-- indoors -->
  <rect x="20" y="80" width="190" height="200" rx="8" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="30" y="100" class="s">Indoors</text>
  <rect class="o" x="40" y="115" width="150" height="45" rx="5"/><text x="115" y="143" text-anchor="middle">Mains 230 V</text>
  <rect class="o" x="40" y="200" width="150" height="60" rx="5"/><text x="115" y="222" text-anchor="middle" class="t">12 V / 1 A adapter</text><text x="115" y="240" text-anchor="middle" class="s">bought, CE-marked</text><text x="115" y="253" text-anchor="middle" class="s">(not our design)</text>
  <path class="pw" d="M115 160 V198"/>
  <path class="pw" d="M190 230 H258 V128 H288"/>
  <text x="20" y="302" class="lp">12 V over up to 10 m of cable:</text>
  <text x="20" y="316" class="lp">at 5 V it would drop 1.7 V</text>

  <!-- phone bay -->
  <rect x="250" y="62" width="935" height="600" rx="10" fill="#fafafa" stroke="#888" stroke-dasharray="8 5"/>
  <text x="262" y="80" class="s">Phone bay under the roof: sealed, 20 mm foam, kept ≥ +5 °C</text>

  <!-- module board -->
  <rect x="270" y="90" width="640" height="555" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="282" y="108" class="t">Lookout module board</text><text x="440" y="108" class="s">2-layer FR-4, 1.6 mm, LF-HASL</text>

  <!-- power row -->
  <rect class="p" x="290" y="118" width="130" height="52" rx="5"/><text x="355" y="140" text-anchor="middle" class="t">12 V in</text><text x="355" y="157" text-anchor="middle" class="s">connector + one TVS</text>
  <rect class="p" x="460" y="118" width="150" height="52" rx="5"/><text x="535" y="140" text-anchor="middle" class="t">Buck 12 → 5 V</text><text x="535" y="157" text-anchor="middle" class="s">XL1509, 2 A, EN pin</text>
  <rect class="p" x="660" y="118" width="160" height="52" rx="5"/><text x="740" y="140" text-anchor="middle" class="t">USB-C receptacle</text><text x="740" y="157" text-anchor="middle" class="s">source, Rp = 1.5 A</text>
  <path class="pw" d="M420 144 H458"/>
  <path class="pw" d="M610 144 H658"/>
  <rect class="p" x="460" y="200" width="150" height="45" rx="5"/><text x="535" y="220" text-anchor="middle" class="t">LDO 12 → 3.3 V</text><text x="535" y="236" text-anchor="middle" class="s">HT7533: MCU, ADCs, bridges</text>
  <path class="pw" d="M420 160 H440 V222 H458"/>

  <!-- heater -->
  <rect class="p" x="290" y="200" width="130" height="80" rx="5"/><text x="355" y="220" text-anchor="middle" class="t">Heater</text><text x="355" y="237" text-anchor="middle" class="s">FET + power resistors</text><text x="355" y="251" text-anchor="middle" class="s">4 W at 12 V, pressed</text><text x="355" y="265" text-anchor="middle" class="s">against the phone tray</text>
  <path class="pw" d="M330 170 V198"/>

  <!-- MCU -->
  <rect class="m" x="440" y="300" width="230" height="140" rx="6"/>
  <text x="555" y="325" text-anchor="middle" class="t">MCU (WCH RISC-V)</text>
  <text x="555" y="344" text-anchor="middle">CH32X035G8U6</text>
  <text x="555" y="362" text-anchor="middle" class="s">cheaper than CH32V203</text>
  <text x="555" y="380" text-anchor="middle" class="s">USB FS host, Android Open Accessory</text>
  <text x="555" y="396" text-anchor="middle" class="s">48 MHz; crystal-less USB to be checked</text>
  <text x="555" y="412" text-anchor="middle" class="s">firmware fit: 5.6 KB flash, 8.9 KB RAM</text>
  <text x="555" y="428" text-anchor="middle" class="s">heater PI, fan, charge window</text>
  <path class="pw" d="M555 245 V298"/>
  <path class="w" d="M670 315 H740 V172"/><text x="676" y="309" class="l">USB D+/D−</text>
  <path class="w" d="M640 298 V185 H580 V172"/><text x="645" y="262" class="l">EN: phone 5 V</text><text x="645" y="274" class="l">off overnight</text>
  <path class="w" d="M440 330 H400 V282"/><text x="366" y="345" class="l">PWM</text>

  <!-- sensors and drivers on the right of the board -->
  <rect class="b" x="740" y="290" width="150" height="45" rx="5"/><text x="815" y="310" text-anchor="middle" class="t">NTC 10 k</text><text x="815" y="326" text-anchor="middle" class="s">bay temperature</text>
  <path class="w" d="M738 312 H672"/><text x="680" y="350" class="l">ADC</text>
  <rect class="b" x="740" y="365" width="150" height="45" rx="5"/><text x="815" y="385" text-anchor="middle" class="t">Mic preamp</text><text x="815" y="401" text-anchor="middle" class="s">the MCU's own op-amp</text>
  <path class="w" d="M738 388 H672"/><text x="680" y="382" class="l">ADC 32 kHz</text>
  <rect class="p" x="740" y="440" width="150" height="45" rx="5"/><text x="815" y="460" text-anchor="middle" class="t">Fan FET</text><text x="815" y="476" text-anchor="middle" class="s">on > 35 °C, off &lt; 32 °C</text>
  <path class="w" d="M640 440 V462 H738"/>

  <!-- ADCs -->
  <rect class="b" x="290" y="490" width="380" height="60" rx="5"/>
  <text x="480" y="512" text-anchor="middle" class="t">5 × HX711 24-bit bridge ADC</text>
  <text x="480" y="530" text-anchor="middle" class="s">one per load cell, 10 Hz, gain 128, 3.3 V excitation</text>
  <text x="480" y="544" text-anchor="middle" class="s">cheaper than the CS1237 at 5 per board</text>
  <path class="w" d="M480 488 V442"/><text x="486" y="470" class="l">DOUT / SCK ×5</text>

  <rect class="b" x="290" y="580" width="380" height="45" rx="5"/><text x="480" y="600" text-anchor="middle" class="t">5 × load-cell connectors</text><text x="480" y="616" text-anchor="middle" class="s">on the board edge, 4-wire each</text>
  <path class="w" d="M480 578 V552"/>
  <rect class="b" x="740" y="580" width="150" height="45" rx="5"/><text x="815" y="600" text-anchor="middle" class="t">SWD pads</text><text x="815" y="616" text-anchor="middle" class="s">programming; no LED</text>

  <!-- in the bay, off the board -->
  <rect class="m" x="950" y="110" width="215" height="110" rx="6"/>
  <text x="1057" y="132" text-anchor="middle" class="t">Buyer's old Android phone</text>
  <text x="1057" y="152" text-anchor="middle" class="s">camera through the window → species</text>
  <text x="1057" y="168" text-anchor="middle" class="s">sound → species and call type</text>
  <text x="1057" y="184" text-anchor="middle" class="s">the app, alerts, home Wi-Fi</text>
  <text x="1057" y="200" text-anchor="middle" class="s">charge kept at 40–80 %</text>
  <path class="pw" d="M820 140 H948"/><text x="836" y="132" class="lp">VBUS 5 V, up to 1.5 A</text>
  <path class="w" d="M948 160 H822" marker-start="url(#a)"/><text x="836" y="176" class="l">AOA: weights, audio, bay</text>
  <rect class="o" x="950" y="365" width="215" height="45" rx="5"/><text x="1057" y="385" text-anchor="middle" class="t">MEMS microphone</text><text x="1057" y="401" text-anchor="middle" class="s">acoustic port under the eave</text>
  <path class="w" d="M948 388 H892"/>
  <rect class="o" x="950" y="440" width="215" height="45" rx="5"/><text x="1057" y="460" text-anchor="middle" class="t">30 mm 5 V fan</text><text x="1057" y="476" text-anchor="middle" class="s">gravity louvre, summer cooling</text>
  <path class="pw" d="M892 462 H948"/>

  <!-- outside the bay -->
  <text x="290" y="690" class="s">Under the feeder, on cables (outside the bay)</text>
  <rect class="o" x="290" y="700" width="120" height="58" rx="5"/><text x="350" y="722" text-anchor="middle" class="t">Tray cell</text><text x="350" y="739" text-anchor="middle" class="s">3 kg: hopper +</text><text x="350" y="752" text-anchor="middle" class="s">tray + seed</text>
  <rect class="o" x="430" y="700" width="240" height="58" rx="5"/><text x="550" y="722" text-anchor="middle" class="t">4 × perch cells</text><text x="550" y="739" text-anchor="middle" class="s">300 g each, one per perch segment,</text><text x="550" y="752" text-anchor="middle" class="s">weighs several birds at once</text>
  <path class="w" d="M350 698 V627"/>
  <path class="w" d="M550 698 V627"/>
  <text x="690" y="722" class="s">Total ≈ 6 W max (EST). Protection cut on purpose apart from the TVS</text>
  <text x="690" y="738" class="s">on the long outdoor 12 V cable: no fuse, no reverse-polarity FET.</text>
</svg>
